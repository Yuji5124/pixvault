name: Delete Project permanently
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: '削除する Project ID（アプリの完全削除画面からコピー）'
        required: true
        type: string
      asset_count:
        description: '削除する画像の枚数（アプリに表示された値）'
        required: true
        type: string
      confirmation:
        description: '確認文字列 DELETE の後に半角スペースと Project ID'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Delete only the confirmed Project
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          ASSET_COUNT: ${{ inputs.asset_count }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/delete-project.js "$PROJECT_ID" "$ASSET_COUNT" "$CONFIRMATION"
      - run: npm run build
      - name: Commit file deletion
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets public/thumbnails public/data
          git commit -m "Delete Project $PROJECT_ID and its assets"
          git push origin HEAD:main
      # A push using GITHUB_TOKEN does not trigger the regular deploy workflow.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: delete
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
